<head>
  <meta charset="UTF-8" />

  <title>The Kandela Group | Strategic Holding Company</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.svg" />

    content="The Kandela Group is a strategic holding company dedicated to building, acquiring, and elevating premier companies across finance, advisory, and media sectors." />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />

    content="Building, acquiring, and elevating premier companies across finance, advisory, and media sectors." />

    content="Building, acquiring, and elevating premier companies across finance, advisory, and media sectors." />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            teal: {
              800: '#006464',
              900: '#004d4d',
            },
            slate: {
              950: '#020617',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            serif: ['Playfair Display', 'serif'],
          },
          animation: {
            'fade-in': 'fadeIn 1.5s ease-out forwards',
            'slide-up': 'slideUp 1s ease-out forwards',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            slideUp: {
              '0%': { opacity: '0', transform: 'translateY(20px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            }
          }
        },
      },
    };
  </script>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:wght@400;700&display=swap"
    rel="stylesheet">
  <style>
    body {
      background-color: #020617;
      color: white;
    }

    /* Custom Scrollbar for Webkit */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #0f172a;
    }

    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
  </style>
